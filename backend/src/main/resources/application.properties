# Nom de l'application
spring.application.name=medical-backend
server.port=8081

# CONFIGURATION BASE DE DONNÉES (MySQL) 
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/medical_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=ProjetPFA2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURATION JPA / HIBERNATE
# 'update' crée les tables automatiquement à partir de @Entity

spring.jpa.hibernate.ddl-auto=update

#spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Stratégie de nommage (Garantit que IdentifiantP reste IdentifiantP en SQL)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- CONFIGURATION DE L'ADMINISTRATION (Bootstrap) ---
app.bootstrap-admin.enabled=true
app.bootstrap-admin.username=admin
app.bootstrap-admin.password=admin
app.bootstrap-admin.role=ADMIN

# --- CONFIGURATION DES DONNÉES DE TEST ---

app.test-data.enabled=true 

# SÉCURITÉ
jwt.secret=${JWT_SECRET:cleSecreteDeDeveloppementQuiEstSuffisammentLongueEtSecurisee123!}
jwt.expiration=86400000

# Configuration de l'envoi de mails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ssalmarezgui@gmail.com
spring.mail.password=${MAIL_PASSWORD:mot_de_passe_de_developpement_local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true


# Configuration SPRING AI (OLLAMA + CHROMADB)
spring.ai.ollama.base-url=http://localhost:11434
#Modele de raisonnemet clinique
spring.ai.ollama.chat.optios.model=mistral
#Modele d'embeddings pour trasformer le texte en cordonnees mathematique
spring.ai.ollama.embedding.options.model=nomic-embed-text
#Adresse du Vector Store local ChromaDB
spring.ai.vectorstore.chroma.client.host=http://localhost:8000


# CONFIGURATION DE L'OBSERVABILITÉ (METRICS)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
# Associer le nom de l'application à toutes les métriques générées
management.metrics.tags.application=${spring.application.name}