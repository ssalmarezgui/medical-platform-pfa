# Nom de l'application
spring.application.name=medical-backend
server.port=8081

# CONFIGURATION BASE DE DONNÉES (MySQL) 
spring.datasource.url=jdbc:mysql://localhost:3306/medical_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ProjetPFA2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURATION JPA / HIBERNATE
# 'update' crée les tables automatiquement à partir de @Entity

spring.jpa.hibernate.ddl-auto=update

#spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Stratégie de nommage (Garantit que IdentifiantP reste IdentifiantP en SQL)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- CONFIGURATION DE L'ADMINISTRATION (Bootstrap) ---
app.bootstrap-admin.enabled=true
app.bootstrap-admin.username=admin
app.bootstrap-admin.password=admin
app.bootstrap-admin.role=ADMIN

# --- CONFIGURATION DES DONNÉES DE TEST ---
# Mettez à 'true' pour remplir la base avec des hôpitaux, médecins et patients de test
app.test-data.enabled=true 

# --- SÉCURITÉ (JWT) ---
jwt.secret=***REMOVED***
jwt.expiration=86400000