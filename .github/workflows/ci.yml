name: Integration & Deploiement Continus (CI/CD)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:

  gitleaks-ci:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source (historique complet)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Executer Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  backend-ci:
    name: Build & Test Backend 
    runs-on: ubuntu-latest
    steps: 
      - name: Recuperer le code source (historique complet)
        uses: actions/checkout@v3 
        with:
          fetch-depth: 0 

      - name: Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compiler et Analyser avec SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        run: |
          cd backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ssalmarezgui_medical-platform-pfa -DskipTests


  frontend-ci:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Installer et compiler le Frontend React
        run: |
          cd frontend
          npm install
          npm run build


  snyk-ci:
    name: Snyk Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Telecharger les dependances Maven
        run: |
          cd backend
          mvn dependency:resolve

      - name: Installer le Snyk CLI
        uses: snyk/actions/setup@master

      - name: Executer Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high


  terraform-ci:
    name: Terraform & LocalStack AWS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.8

      - name: Demarrer LocalStack (Simulateur AWS)
        uses: localstack/setup-localstack@v2
        with:
          image-tag: 'latest'
          install-cli: 'true'

      - name: Valider l'Infrastructure avec Terraform
        run: |
          cd terraform
          terraform init
          terraform plan
          terraform apply -auto-approve


  docker-cd:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest
    needs: [gitleaks-ci, backend-ci, frontend-ci, snyk-ci]
    
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Connexion a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Backend - Construire l'image locale
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          load: true
          tags: medical-backend:test

      - name: Backend - Scan de securite Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-backend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Backend - Envoyer l'image validee sur Docker Hub
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-backend:latest



      - name: Frontend - Construire l'image locale
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          load: true
          tags: medical-frontend:test

      - name: Frontend - Scan de securite Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-frontend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Frontend - Envoyer l'image validee sur Docker Hub
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-frontend:latest