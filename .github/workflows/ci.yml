name: Integration & Deploiement Continus (CI/CD)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:

  gitleaks-ci:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source (historique complet)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Executer Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  backend-ci:
    name: Build & Test Backend 
    runs-on: ubuntu-latest
    steps: 
      - name: Recuperer le code source (historique complet)
        uses: actions/checkout@v3 
        with:
          fetch-depth: 0 

      - name: Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Étape corrigée : On retire -DskipTests et on indique à SonarCloud le chemin du rapport de couverture JaCoCo
      - name: Compiler, Tester et Analyser avec SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        run: |
          cd backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ssalmarezgui_medical-platform-pfa \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml


  frontend-ci:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Installer et compiler le Frontend React
        run: |
          cd frontend
          npm install
          npm run build


  snyk-ci:
    name: Snyk Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Étape corrigée : Compilation sans les tests pour générer l'arbre des dépendances proprement avant Snyk
      - name: Compiler les dependances Maven
        run: |
          cd backend
          mvn clean compile -DskipTests

      - name: Installer le Snyk CLI
        uses: snyk/actions/setup@master

      - name: Executer Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high


  terraform-ci:
    name: Terraform & LocalStack AWS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Analyser la securite de l'IaC avec Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
      
      - name: Analyser la securite de Kubernetes avec Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: kubernetes/
          framework: kubernetes
          soft_fail: true

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.8

      - name: Demarrer LocalStack (Simulateur AWS)
        run: |
          docker run -d --name localstack_aws -p 4566:4566 localstack/localstack:3.2.0
          sleep 20

      - name: Valider l'Infrastructure avec Terraform
        run: |
          cd terraform
          terraform init
          terraform plan


  dast-ci:
    name: OWASP ZAP DAST Security Scan
    runs-on: ubuntu-latest
    # On attend que le backend et le frontend soient compilés avec succès
    needs: [backend-ci, frontend-ci]
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      # Étape 1 : Démarrer toute l'application en arrière-plan sur le runner
      - name: Demarrer l'application avec Docker Compose
        run: |
          docker compose up -d
          # Attendre 25 secondes que Spring Boot démarre complètement
          sleep 25

      # Étape 2 : Lancer le scan OWASP ZAP sur le site React local 
      - name: Executer OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Requis pour que ZAP puisse créer le ticket d'alerte automatiquement
          target: 'http://localhost:5173'
          fail_action: false # N'échoue pas le pipeline pour des alertes mineures (en-têtes manquants)
        


  docker-cd:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest
    needs: [gitleaks-ci, backend-ci, frontend-ci, snyk-ci]
    
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Connexion a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Backend - Construire l'image locale
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          load: true
          tags: medical-backend:test

      - name: Backend - Scan de securite Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-backend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Backend - Envoyer l'image validee sur Docker Hub
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-backend:latest



      - name: Frontend - Construire l'image locale
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          load: true
          tags: medical-frontend:test

      - name: Frontend - Scan de securite Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-frontend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Frontend - Envoyer l'image validee sur Docker Hub
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-frontend:latest