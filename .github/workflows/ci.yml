name: Integration Continue (CI)

# 1- EVENT (déclencheur) : on lance ce pipeline sur toutes les branches

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

# 2- JOBS : on définit les taches principales à exécuter

jobs:
  backend-ci:
    name: Build & Test Backend 
    runs-on: ubuntu-latest
    steps: 
    # Action réutilisable officielle GitHub pour récupérer le code source du projet
      - name: Recuperer le code source
        uses: actions/checkout@v3 
    
    # Installer Java Portable 
      - name: Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

    # Compiler et lancer les tess unitaires Java avec Maven
      - name: Compiler et Tester avec Maven
        run: |
          cd backend
          mvn clean test

# 3- Compiler et Tester le Frontend React 

  frontend-ci:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
    # Recuperer le code
      - name: Recuperer le code source
        uses: actions/checkout@v3

    # Installer Node.js Portable
      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

    # Installer les dependances npm et tester le code React
      - name: Installer et compiler le Frontend React
        run: |
          cd frontend
          npm install
          npm run build







